server {
    listen 80;
    client_max_body_size 5m;

    # re-resolve service names so a restarted backend container does not leave nginx on a stale IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_web web:8000;
    set $backend_ws  ws:8001;
    set $frontend_ui frontend:80;

    location /api/     { proxy_pass http://$backend_web; include /etc/nginx/proxy.conf; }
    location /admin/   { proxy_pass http://$backend_web; include /etc/nginx/proxy.conf; }
    location /captcha/ { proxy_pass http://$backend_web; include /etc/nginx/proxy.conf; }
    location /graphql/ { proxy_pass http://$backend_web; include /etc/nginx/proxy.conf; }
    location /media/   { alias /app/media/; expires 7d; add_header X-Content-Type-Options nosniff always; }
    location /static/  { alias /app/staticfiles/; expires 7d; }

    location /ws/ {
        proxy_pass http://$backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://$frontend_ui;
        include /etc/nginx/proxy.conf;
    }
}
